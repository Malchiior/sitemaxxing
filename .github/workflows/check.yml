name: check
on:
  push:
  pull_request:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests (URL guard, texts, pages, re-check, fix reply, contact card)
        run: |
          node --test tests/*.test.ts tests/*.test.mjs
      - name: Build image (verifies every pinned checksum)
        run: docker build -t sitemaxxing:ci .
      - name: Offline probe (Chromium renders 9 screens; gateway boots with the plugin)
        run: docker run --rm --network none sitemaxxing:ci /opt/plow/ro-probe | tee probe.log && grep -q RO_PROBE_OK probe.log
