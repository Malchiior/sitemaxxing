name: sitemaxxing
# Local run on a real Plow line:
#   plow-agents mint LINE_UID      # writes ./plow-credentials
#   docker compose up --build -d
#   docker compose logs -f agent
services:
  agent:
    build: .
    env_file: ./plow-credentials
    volumes:
      - state:/var/lib/plow
    restart: unless-stopped
    stop_grace_period: 35s
volumes:
  state:
