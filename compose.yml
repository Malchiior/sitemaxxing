name: sitemaxxing
# Local run on a real Plow line:
#   plow-agents mint LINE_UID      # writes ./plow-credentials
#   docker compose up --build -d
#   docker compose logs -f agent
services:
  agent:
    build: .
    env_file:
      - ./plow-credentials
      # Optional: REPORT_URL and REPORT_KEY for the hosted report page.
      - path: ./.env.report
        required: false
    volumes:
      - state:/var/lib/plow
    restart: unless-stopped
    stop_grace_period: 35s
volumes:
  state:
